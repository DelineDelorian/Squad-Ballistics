name: build-windows

# Builds SquadBallistics.exe on Windows and uploads it as a downloadable
# artifact (Actions -> run -> Artifacts). This does NOT publish a release,
# so users' auto-updater is not affected.
#
# A release is published only when a tag like v1.2.0 is pushed
# (see RELEASING.md).

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build exe
        run: pyinstaller --noconfirm --clean SquadBallistics.spec

      - name: Self-test the built exe
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $p = Start-Process dist\SquadBallistics\SquadBallistics.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content dist\SquadBallistics\selftest.log
          Remove-Item dist\SquadBallistics\selftest.log
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: SquadBallistics-${{ github.sha }}
          path: dist/
          retention-days: 14

      - name: Pack release zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist\SquadBallistics -DestinationPath SquadBallistics.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SquadBallistics.zip
          generate_release_notes: true

permissions:
  contents: write
