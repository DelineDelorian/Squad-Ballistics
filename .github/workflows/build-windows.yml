name: build-windows

# Builds the single-file SquadBallistics.exe on Windows and uploads it as a
# downloadable artifact (Actions -> run -> Artifacts). This does NOT publish
# a release, so users' auto-updater is not affected.
#
# A release is published only when a tag like v1.2.0 is pushed, or when the
# workflow is started by hand with "publish_release" (it then creates the
# tag v<version.txt> itself). See RELEASING.md.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a release v<version.txt> from this commit"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref }}".StartsWith("refs/tags/v") -and "${{ github.ref_name }}" -ne "v$v") {
            Write-Error "Tag ${{ github.ref_name }} does not match version.txt ($v)"; exit 1
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build exe
        run: pyinstaller --noconfirm --clean SquadBallistics.spec

      - name: Self-test the built exe
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $p = Start-Process dist\SquadBallistics.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content dist\selftest.log
          Remove-Item dist\selftest.log
          if ($p.ExitCode -ne 0) { exit 1 }
          $files = Get-ChildItem dist | Select-Object -ExpandProperty Name
          if ($files -ne "SquadBallistics.exe") { Write-Error "Unexpected files in dist: $files"; exit 1 }
          "{0:N0} MB" -f ((Get-Item dist\SquadBallistics.exe).Length / 1MB)

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: SquadBallistics-${{ github.sha }}
          path: dist/SquadBallistics.exe
          retention-days: 14

      # Versions up to 1.1.0 update by downloading SquadBallistics.zip and
      # copying its "SquadBallistics" folder over the installed one. This zip
      # carries the new single .exe in that layout, so they update too.
      - name: Pack update zip for old versions
        if: env.PUBLISH == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force legacy\SquadBallistics | Out-Null
          Copy-Item dist\SquadBallistics.exe legacy\SquadBallistics\
          Compress-Archive -Path legacy\SquadBallistics -DestinationPath SquadBallistics.zip

      - name: Publish release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Squad Ballistics v${{ steps.version.outputs.version }}
          make_latest: true
          body_path: RELEASE_NOTES.md
          files: |
            dist/SquadBallistics.exe
            SquadBallistics.zip
